name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  live-check:
    # Talks to the real MTA feeds: reports CORS headers, feed sizes and decode times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/live-check.mjs
      - name: Feed transfer sizes (with and without compression)
        run: |
          for f in gtfs-ace gtfs-bdfm gtfs-g gtfs; do
            u="https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2F$f"
            plain=$(curl -s -o /dev/null -w "%{size_download}" "$u")
            enc=$(curl -s -D - -o /dev/null -H "Accept-Encoding: gzip, br" "$u" | grep -i '^content-encoding' | tr -d '\r')
            wire=$(curl -s -o /dev/null -w "%{size_download}" -H "Accept-Encoding: gzip, br" "$u")
            echo "$f plain=${plain}B wire=${wire}B ${enc:-content-encoding: none}"
          done

  pages:
    # Publishes the static site to the gh-pages branch (served by GitHub Pages).
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $GITHUB_SHA"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  deploy:
    # Optional: Cloudflare Worker "fast mode". Skipped unless the secrets are set.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy. See README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
