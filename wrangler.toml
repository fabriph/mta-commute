name = "mta-commute"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Serve .html files as text imports.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.webmanifest"]
fallthrough = true

# Serve images as binary imports.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[observability]
enabled = false
